<!DOCTYPE html>
<html lang="en">
<head>
<style>
    .one{
        background-color: yellowgreen;
    }
    .two{
        background-color: tomato;
        margin: 30px;
        width: 500px;
        padding: 20px;
        text-align: center;
        border: 4px solid solid blueviolet;
    }
    .three{
        text-align: justify;
        text-align: uppercase;
        text-overflow: ellipsis;
        text-indent: 200px;
        letter-spacing: 4px;
        text-transform: uppercase;
        word-spacing: 10px;
        line-height: 3px;
        text-shadow: 10px 10px rebeccapurple;
    }

</style>
</head>
<body>
    <P class="one">This is paragraph tag or element</P>
    <h2 class="two">this is haeder 2</h2>
    <h3 class="three">This is a h3 element</h3>
    
</body>
</html>
